# ==============================================================================
# Alpine Lab Splunk Saved Searches & Detection Engineering Rules
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Honeytoken AS-REP Roasting Detection (Deception Trigger)
# ------------------------------------------------------------------------------
[Alpine - Honeytoken AS-REP Roasting Attempt (T1558.004)]
search = index=endpoint_data EventCode=4768 TargetUserName="svc_sql_prod_migration" PreAuthType=0 TicketEncryptionType=0x17 \
| eval risk_object=ClientAddress, risk_object_type="system", risk_score=100, threat_technique="T1558.004", description="Direct AS-REP roasting attempt targeting high-privilege honeytoken account" \
| collect index=risk
cron_schedule = * * * * *
disabled = 0

# ------------------------------------------------------------------------------
# 2. Anomalous Kerberos Origin: explorer.exe Requesting Ticket over Port 88
# ------------------------------------------------------------------------------
[Alpine - Suspicious Kerberos Traffic from Injected Explorer (T1055 / T1558)]
search = index=endpoint_data EventCode=3 DestinationPort=88 Image="*\\explorer.exe" \
| eval risk_object=Computer, risk_object_type="system", risk_score=40, threat_technique="T1055", description="explorer.exe generated outbound Kerberos authentication traffic over port 88" \
| collect index=risk
cron_schedule = */2 * * * *
disabled = 0

# ------------------------------------------------------------------------------
# 3. Zeek Network C2 Beaconing Detection (Streamstats Timing Delta)
# ------------------------------------------------------------------------------
[Alpine - Meterpreter C2 Beaconing Analysis via Zeek conn.log (T1071.001)]
search = index="network_data" source="*conn.log" sourcetype="_json" \
| sort _time \
| streamstats current=f window=1 last(_time) as prev_time by id.orig_h, id.resp_h, orig_bytes \
| eval time_delta = round(_time - prev_time, 0) \
| stats count by id.orig_h, id.resp_h, orig_bytes, time_delta \
| where count >= 50 and time_delta == 2 \
| eval risk_object=id.orig_h, risk_object_type="system", risk_score=40, threat_technique="T1071.001", description="Rigid 2.0-second automated C2 beaconing interval with uniform payload byte size" \
| collect index=risk
cron_schedule = */5 * * * *
disabled = 0

# ------------------------------------------------------------------------------
# 4. Suricata JA4 TLS Fingerprint Match (Metasploit Payload)
# ------------------------------------------------------------------------------
[Alpine - Suricata JA4 Metasploit C2 TLS Fingerprint Match (T1071.001)]
search = index=network_data sourcetype=suricata_json event_type=tls tls.ja4="t13d1516h2_8daaf6152771_a00000000000" \
| stats count by src_ip, dest_ip, dest_port, tls.ja4, tls.sni \
| where count > 0 \
| eval risk_object=src_ip, risk_object_type="system", risk_score=40, threat_technique="T1071.001", description="Client Hello TLS JA4 fingerprint matched known Metasploit Meterpreter C2 payload" \
| collect index=risk
cron_schedule = */2 * * * *
disabled = 0

# ------------------------------------------------------------------------------
# 5. SilkETW Active Directory Enumeration Detection (SharpHound YARA)
# ------------------------------------------------------------------------------
[Alpine - SilkETW SharpHound LDAP YARA Detection (T1069 / T1558)]
search = index=endpoint_data sourcetype=silketw_json YaraMatch IN ("AdminScanning", "SPNScanning", "ASREPRoastScan") \
| eval risk_object=ComputerName, risk_object_type="system", risk_score=80, threat_technique="T1069.002", description="SilkETW detected in-flight LDAP queries matching SharpHound enumeration signatures" \
| collect index=risk
cron_schedule = */2 * * * *
disabled = 0

# ------------------------------------------------------------------------------
# 6. Master Risk-Based Alerting (RBA) Correlation Engine & SOAR Dispatcher
# ------------------------------------------------------------------------------
[Alpine - Master RBA Incident Trigger & SOAR Quarantine Execution]
search = index=risk earliest=-10m \
| stats sum(risk_score) as total_risk, values(threat_technique) as techniques, values(description) as findings by risk_object \
| where total_risk >= 100
cron_schedule = * * * * *
disabled = 0
alert.severity = 5
action.webhook = 1
action.webhook.enable_allowlist = 0
# CHANGE_ME_SHARED_SECRET must match ALPINE_WEBHOOK_TOKEN on the Micro-SOAR
# listener (src/soar/flask-soar-listener.py) -- required so /isolate can't
# be triggered by anything that can merely reach the port. Generate a real
# secret and keep both sides in sync.
action.webhook.param.url = http://10.254.2.100:5000/isolate?token=CHANGE_ME_SHARED_SECRET
