# ==============================================================================
# Alpine Lab Splunk Universal Forwarder Inputs Configuration
# ==============================================================================

# --- Windows Endpoint Telemetry (HR-01 & Domain Controller) ---

# Standard Windows Security Log (Captures EID 4768 Kerberos Pre-Auth Requests)
[WinEventLog://Security]
disabled = 0
renderXml = 1
index = endpoint_data

# Sysmon Operational Telemetry (Captures EIDs 1, 3, 7, 8, 10, 11, 15)
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
renderXml = 1
index = endpoint_data

# Active Directory Directory Service Log (Domain Controller)
[WinEventLog://Directory Service]
disabled = 0
renderXml = 1
index = endpoint_data

# PowerShell Script Block Logging (EID 4104)
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
renderXml = 1
index = endpoint_data

# SilkETW JSON Output (LDAP Client YARA Matches)
[monitor://C:\ProgramData\SilkETW\logs\silketw_ldap.json]
disabled = 0
index = endpoint_data
sourcetype = silketw_json

# --- Linux Network Sensor Telemetry (Promiscuous Sniffer) ---

# Zeek Structured JSON Connection Logs (C2 Beaconing Analysis)
[monitor:///opt/zeek/logs/current/conn.log]
disabled = 0
index = network_data
sourcetype = _json

# Suricata EVE Structured JSON Logs (JA4 TLS Fingerprints & IDS Alerts)
[monitor:///var/log/suricata/eve.json]
disabled = 0
index = network_data
sourcetype = suricata_json
