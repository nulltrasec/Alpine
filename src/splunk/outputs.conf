# ==============================================================================
# Alpine Lab Splunk Universal Forwarder Outputs Configuration
# ==============================================================================
# Note: Forwarders point to the Gateway VIP (10.254.2.1:9997) on V.S 2.
# iptables DNAT on the management plane seamlessly redirects packets to the
# real hidden Splunk indexer IP, preserving SOC infrastructure OPSEC.
# ==============================================================================

[tcpout]
defaultGroup = alpine_splunk_cluster

[tcpout:alpine_splunk_cluster]
server = 10.254.2.1:9997
compressed = true
